# Fabric + studio (+ web UI) in containers. GPU workers and Ollama stay native on the host so they
# keep direct access to CUDA / Metal; start them with --host 0.0.0.0 so containers can reach them.
services:
  fabric:
    build: .
    command: ["uvicorn", "cinemafabric.fabric.app:app", "--host", "0.0.0.0", "--port", "8100"]
    env_file:
      - path: .env
        required: false
    environment:
      CF_DATA_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    ports:
      - "8100:8100"
    restart: unless-stopped

  studio:
    build: .
    command: ["uvicorn", "cinemafabric.studio.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      CF_DATA_DIR: /data
      CF_FABRIC_URL: http://fabric:8100
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      - fabric
    restart: unless-stopped

  # Optional: docker compose --profile monitoring up
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data:/data:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - fabric

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
