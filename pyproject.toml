[project]
name = "cinemafabric"
version = "0.1.0"
description = "Turns a one-line idea into a trailer or short film, using Meta models on a hybrid local/cloud inference fabric."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "truststore>=0.9",
    "meta-sam-parser>=0.1.0",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# Local model workers. Torch comes from the CUDA 12.8 index.
gpu = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.46",
    "accelerate>=0.34",
    "sentencepiece>=0.2",
    "audioseal>=0.2.0",
]
postgres = [
    "psycopg[binary]>=3.2",
]
s3 = [
    "boto3>=1.35",
]
c2pa = [
    "c2pa-python==0.38.0",  # the last release with Windows and Linux wheels
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cinemafabric"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# HTML and prompt templates: breaking their lines would change the output.
"cinemafabric/studio/share.py" = ["E501"]
"cinemafabric/studio/prompts.py" = ["E501"]
"cinemafabric/tools/architecture.py" = ["E501"]
